apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: park-ray-cluster
  namespace: ray
spec:
  rayVersion: "2.35.0"
  headGroupSpec:
    rayStartParams:
      dashboard-host: "0.0.0.0"
      num-cpus: "2"
    template:
      spec:
        serviceAccountName: ray-worker-sa
        nodeSelector:
          role: cpu-worker
        containers:
          - name: ray-head
            image: 515966515749.dkr.ecr.us-east-1.amazonaws.com/park-cifar10:v1
            imagePullPolicy: IfNotPresent
            readinessProbe:
              exec:
                command: ["ray", "health-check"]
              initialDelaySeconds: 5
              periodSeconds: 5
            livenessProbe:
              exec:
                command: ["ray", "health-check"]
              initialDelaySeconds: 15
              periodSeconds: 10
            resources:
              limits:
                cpu: "2"
                memory: "4Gi"
              requests:
                cpu: "1"
                memory: "2Gi"
            ports:
              - containerPort: 6379
                name: gcs
              - containerPort: 8265
                name: dashboard
              - containerPort: 10001
                name: client
            env:
              - name: AWS_REGION
                value: "us-east-1"
              - name: S3_BUCKET_NAME
                value: "park-ml-experiments-515966515749-us-east-1"
              - name: ANTHROPIC_AWS_WORKSPACE_ID
                valueFrom:
                  secretKeyRef:
                    name: claude-aws-credentials
                    key: workspace-id
              - name: ANTHROPIC_AWS_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: claude-aws-credentials
                    key: api-key
                    optional: true
              - name: AWS_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: claude-aws-credentials
                    key: aws-access-key-id
                    optional: true
              - name: AWS_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: claude-aws-credentials
                    key: aws-secret-access-key
                    optional: true
  workerGroupSpecs:
    - groupName: cpu-workers
      replicas: 1
      minReplicas: 1
      maxReplicas: 2
      rayStartParams:
        num-cpus: "2"
      template:
        spec:
          serviceAccountName: ray-worker-sa
          nodeSelector:
            role: cpu-worker
          containers:
            - name: ray-worker
              image: 515966515749.dkr.ecr.us-east-1.amazonaws.com/park-cifar10:v1
              imagePullPolicy: IfNotPresent
              readinessProbe:
                exec:
                  command: ["ray", "health-check"]
                initialDelaySeconds: 5
                periodSeconds: 5
              livenessProbe:
                exec:
                  command: ["ray", "health-check"]
                initialDelaySeconds: 15
                periodSeconds: 10
              resources:
                limits:
                  cpu: "2"
                  memory: "4Gi"
                requests:
                  cpu: "1"
                  memory: "2Gi"
              env:
                - name: AWS_REGION
                  value: "us-east-1"
                - name: S3_BUCKET_NAME
                  value: "park-ml-experiments-515966515749-us-east-1"
                - name: ANTHROPIC_AWS_WORKSPACE_ID
                  valueFrom:
                    secretKeyRef:
                      name: claude-aws-credentials
                      key: workspace-id
                - name: ANTHROPIC_AWS_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: claude-aws-credentials
                      key: api-key
                      optional: true
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: claude-aws-credentials
                      key: aws-access-key-id
                      optional: true
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: claude-aws-credentials
                      key: aws-secret-access-key
                      optional: true
