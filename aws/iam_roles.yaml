AWSTemplateFormatVersion: "2010-09-09"
Description: "IAM Roles for Service Accounts (IRSA) for Agentic ML Training Platform on Amazon EKS"

Parameters:
  OIDCProviderArn:
    Type: String
    Description: "ARN of the IAM OIDC Provider for the EKS Cluster (e.g. arn:aws:iam::123456789012:oidc-provider/oidc.eks.us-west-2.amazonaws.com/id/EXAMPLE)"
  
  S3BucketName:
    Type: String
    Description: "Name of the Amazon S3 bucket used for datasets and experiment tracking"

  Namespace:
    Type: String
    Default: "ray"
    Description: "Kubernetes namespace where Ray and ML agent pods are deployed"

  RayWorkerServiceAccount:
    Type: String
    Default: "ray-worker-sa"
    Description: "Name of the Kubernetes ServiceAccount for Ray worker pods"

  AgentServiceAccount:
    Type: String
    Default: "agent-runner-sa"
    Description: "Name of the Kubernetes ServiceAccount for Agent monitoring pods"

  RemediatorServiceAccount:
    Type: String
    Default: "remediator-sa"
    Description: "Name of the Kubernetes ServiceAccount for Remediator agent pods"

  EKSClusterName:
    Type: String
    Default: "park-ml-cluster"
    Description: "Name of the EKS Cluster"

Resources:
  # ============================================================================
  # 1. Ray Worker Role
  # Allows Ray worker pods to read datasets, stream metrics to CloudWatch, and write checkpoints
  # ============================================================================
  RayWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EKSClusterName}-RayWorkerRole"
      Description: "IAM role for Ray worker pods with S3 dataset access and CloudWatch logging"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref OIDCProviderArn
            Action: "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals:
                !Sub
                  - "${OidcUrl}:aud": "sts.amazonaws.com"
                  - OidcUrl: !Select [1, !Split ["oidc-provider/", !Ref OIDCProviderArn]]
              StringLike:
                !Sub
                  - "${OidcUrl}:sub": "system:serviceaccount:${Namespace}:${RayWorkerServiceAccount}"
                  - OidcUrl: !Select [1, !Split ["oidc-provider/", !Ref OIDCProviderArn]]
      Policies:
        - PolicyName: RayWorkerS3DataReadPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:ListBucket"
                Resource:
                  - !Sub "arn:aws:s3:::${S3BucketName}"
                  - !Sub "arn:aws:s3:::${S3BucketName}/datasets/*"
              - Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:PutObject"
                  - "s3:ListBucket"
                Resource:
                  - !Sub "arn:aws:s3:::${S3BucketName}/experiments/*"
        - PolicyName: RayWorkerCloudWatchLoggingPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                  - "logs:DescribeLogStreams"
                Resource:
                  - !Sub "arn:aws:logs:*:*:log-group:/aws/eks/${EKSClusterName}/*"
                  - "arn:aws:logs:*:*:log-group:/ray/*"
              - Effect: Allow
                Action:
                  - "cloudwatch:PutMetricData"
                Resource: "*"
                Condition:
                  StringEquals:
                    "cloudwatch:namespace":
                      - "AgenticMLPlatform"
                      - "RayCluster"
        - PolicyName: RayWorkerECRPullPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "ecr:GetAuthorizationToken"
                  - "ecr:BatchCheckLayerAvailability"
                  - "ecr:GetDownloadUrlForLayer"
                  - "ecr:BatchGetImage"
                Resource: "*"

  # ============================================================================
  # 2. Agent Role
  # Allows ML agents to monitor runs, read/write experiment summaries to S3,
  # inspect CloudWatch logs, and invoke Claude models via Amazon Bedrock
  # ============================================================================
  AgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EKSClusterName}-AgentRole"
      Description: "IAM role for ML agent pods with S3 experiments access, CloudWatch read, and Bedrock invocation"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref OIDCProviderArn
            Action: "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals:
                !Sub
                  - "${OidcUrl}:aud": "sts.amazonaws.com"
                  - OidcUrl: !Select [1, !Split ["oidc-provider/", !Ref OIDCProviderArn]]
              StringLike:
                !Sub
                  - "${OidcUrl}:sub": "system:serviceaccount:${Namespace}:${AgentServiceAccount}"
                  - OidcUrl: !Select [1, !Split ["oidc-provider/", !Ref OIDCProviderArn]]
      Policies:
        - PolicyName: AgentS3StoragePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:ListBucket"
                Resource:
                  - !Sub "arn:aws:s3:::${S3BucketName}"
                  - !Sub "arn:aws:s3:::${S3BucketName}/datasets/*"
              - Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:PutObject"
                  - "s3:DeleteObject"
                  - "s3:ListBucket"
                Resource:
                  - !Sub "arn:aws:s3:::${S3BucketName}"
                  - !Sub "arn:aws:s3:::${S3BucketName}/experiments/*"
        - PolicyName: AgentCloudWatchReadPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "logs:GetLogEvents"
                  - "logs:FilterLogEvents"
                  - "logs:DescribeLogGroups"
                  - "logs:DescribeLogStreams"
                  - "cloudwatch:GetMetricData"
                  - "cloudwatch:GetMetricStatistics"
                  - "cloudwatch:ListMetrics"
                  - "cloudwatch:PutMetricData"
                Resource: "*"
        - PolicyName: AgentBedrockInvokePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "bedrock:InvokeModel"
                  - "bedrock:InvokeModelWithResponseStream"
                  - "bedrock:ListFoundationModels"
                  - "bedrock:GetFoundationModel"
                Resource:
                  - "arn:aws:bedrock:*::foundation-model/*"
                  - "arn:aws:bedrock:*:*:inference-profile/*"

  # ============================================================================
  # 3. Remediator Role
  # Extends AgentRole permissions with limited EKS & EC2 describe capabilities
  # to diagnose anomalies, trigger restarts, or evaluate infrastructure health
  # ============================================================================
  RemediatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EKSClusterName}-RemediatorRole"
      Description: "IAM role for ML remediator agent extending AgentRole with limited EKS & EC2 diagnostic actions"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref OIDCProviderArn
            Action: "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals:
                !Sub
                  - "${OidcUrl}:aud": "sts.amazonaws.com"
                  - OidcUrl: !Select [1, !Split ["oidc-provider/", !Ref OIDCProviderArn]]
              StringLike:
                !Sub
                  - "${OidcUrl}:sub": "system:serviceaccount:${Namespace}:${RemediatorServiceAccount}"
                  - OidcUrl: !Select [1, !Split ["oidc-provider/", !Ref OIDCProviderArn]]
      Policies:
        - PolicyName: RemediatorS3StoragePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:PutObject"
                  - "s3:DeleteObject"
                  - "s3:ListBucket"
                Resource:
                  - !Sub "arn:aws:s3:::${S3BucketName}"
                  - !Sub "arn:aws:s3:::${S3BucketName}/*"
        - PolicyName: RemediatorCloudWatchPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "logs:GetLogEvents"
                  - "logs:FilterLogEvents"
                  - "logs:DescribeLogGroups"
                  - "logs:DescribeLogStreams"
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                  - "cloudwatch:GetMetricData"
                  - "cloudwatch:GetMetricStatistics"
                  - "cloudwatch:ListMetrics"
                  - "cloudwatch:PutMetricData"
                  - "cloudwatch:DescribeAlarms"
                  - "cloudwatch:SetAlarmState"
                Resource: "*"
        - PolicyName: RemediatorBedrockInvokePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "bedrock:InvokeModel"
                  - "bedrock:InvokeModelWithResponseStream"
                  - "bedrock:ListFoundationModels"
                  - "bedrock:GetFoundationModel"
                Resource:
                  - "arn:aws:bedrock:*::foundation-model/*"
                  - "arn:aws:bedrock:*:*:inference-profile/*"
        - PolicyName: RemediatorEKSInspectionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "eks:DescribeCluster"
                  - "eks:ListClusters"
                  - "eks:DescribeNodegroup"
                  - "eks:ListNodegroups"
                  - "eks:DescribeUpdate"
                  - "eks:AccessKubernetesApi"
                Resource:
                  - !Sub "arn:aws:eks:*:*:cluster/${EKSClusterName}"
                  - !Sub "arn:aws:eks:*:*:nodegroup/${EKSClusterName}/*/*"
              - Effect: Allow
                Action:
                  - "ec2:DescribeInstances"
                  - "ec2:DescribeInstanceStatus"
                  - "ec2:DescribeSecurityGroups"
                  - "ec2:DescribeSubnets"
                  - "ec2:DescribeVolumes"
                Resource: "*"

Outputs:
  RayWorkerRoleArn:
    Description: "ARN for the RayWorker IAM Role"
    Value: !GetAtt RayWorkerRole.Arn
    Export:
      Name: !Sub "${EKSClusterName}-RayWorkerRoleArn"

  AgentRoleArn:
    Description: "ARN for the ML Agent IAM Role"
    Value: !GetAtt AgentRole.Arn
    Export:
      Name: !Sub "${EKSClusterName}-AgentRoleArn"

  RemediatorRoleArn:
    Description: "ARN for the ML Remediator IAM Role"
    Value: !GetAtt RemediatorRole.Arn
    Export:
      Name: !Sub "${EKSClusterName}-RemediatorRoleArn"

  RayWorkerServiceAccountAnnotation:
    Description: "Annotation to attach to RayWorker Kubernetes ServiceAccount"
    Value: !Sub "eks.amazonaws.com/role-arn: ${RayWorkerRole.Arn}"

  AgentServiceAccountAnnotation:
    Description: "Annotation to attach to Agent Kubernetes ServiceAccount"
    Value: !Sub "eks.amazonaws.com/role-arn: ${AgentRole.Arn}"

  RemediatorServiceAccountAnnotation:
    Description: "Annotation to attach to Remediator Kubernetes ServiceAccount"
    Value: !Sub "eks.amazonaws.com/role-arn: ${RemediatorRole.Arn}"
