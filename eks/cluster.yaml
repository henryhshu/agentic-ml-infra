# Minimal EKS cluster for reproducing the AutoPARK benchmark suite.
#
# Node group `dist-cpu`: four on-demand c6i.xlarge nodes (4 vCPU, 8 GiB each) in one
# availability zone, one PyTorch DDP rank per node (eks/dist-job.yaml). On-demand so the
# multi-hour run is not exposed to Spot reclamation; the worker failures the benchmark
# studies are injected deliberately. Public subnets, no NAT gateway, to keep idle cost low.
# The benchmark pod reads code from and writes results to a single S3 prefix through
# an IRSA role; no AWS access keys are placed in the cluster.
#
#   eksctl create cluster -f eks/cluster.yaml
#   eksctl delete cluster -f eks/cluster.yaml --wait
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: autopark-eval
  region: us-east-1
  tags:
    Project: autopark-eval
    ManagedBy: eksctl

vpc:
  nat:
    gateway: Disable

iam:
  withOIDC: true
  serviceAccounts:
    - metadata:
        name: autopark-eval
        namespace: autopark
      attachPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: ["s3:GetObject", "s3:PutObject"]
            Resource: "arn:aws:s3:::park-ml-experiments-515966515749-us-east-1/autopark-eval/*"
          - Effect: Allow
            Action: ["s3:ListBucket"]
            Resource: "arn:aws:s3:::park-ml-experiments-515966515749-us-east-1"
            Condition:
              StringLike:
                s3:prefix: ["autopark-eval/*"]

managedNodeGroups:
  - name: dist-cpu
    instanceType: c6i.xlarge
    spot: false
    availabilityZones: ["us-east-1d"]
    minSize: 4
    maxSize: 4
    desiredCapacity: 4
    volumeSize: 40
    volumeType: gp3
    volumeEncrypted: true
    privateNetworking: false
    labels:
      role: autopark-dist
    tags:
      Project: autopark-eval
