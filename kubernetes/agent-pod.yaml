apiVersion: v1
kind: Pod
metadata:
  name: ml-agent-monitor
  namespace: ray
spec:
  serviceAccountName: agent-runner-sa
  restartPolicy: OnFailure
  containers:
    - name: agent
      image: 515966515749.dkr.ecr.us-east-1.amazonaws.com/park-cifar10:v1
      imagePullPolicy: Always
      env:
        - name: AWS_REGION
          value: "us-east-1"
        - name: S3_BUCKET_NAME
          value: "park-ml-experiments-515966515749-us-east-1"
        - name: ANTHROPIC_AWS_WORKSPACE_ID
          valueFrom:
            secretKeyRef:
              name: claude-aws-credentials
              key: workspace-id
        - name: ANTHROPIC_AWS_API_KEY
          valueFrom:
            secretKeyRef:
              name: claude-aws-credentials
              key: api-key
              optional: true
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: claude-aws-credentials
              key: aws-access-key-id
              optional: true
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: claude-aws-credentials
              key: aws-secret-access-key
              optional: true
      command: ["python", "-c"]
      args:
        - |
          import os
          from aws.s3_config import S3Config, S3MetricsStore
          cfg = S3Config(bucket_name=os.environ['S3_BUCKET_NAME'], region=os.environ['AWS_REGION'])
          store = S3MetricsStore(cfg)
          print("Active experiments in S3:", store.list_experiments())
          latest = store.get_latest()
          print("Latest run summary:", latest)
