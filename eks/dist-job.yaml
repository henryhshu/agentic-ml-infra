# Multi-node AutoPARK benchmark: one PyTorch DDP rank per node (gloo over the VPC network).
# Placeholders (${...}) are filled by eks/launch.sh.
#
# Indexed Job with WORLD_SIZE pods; the headless Service gives each pod a stable DNS name
# (<job>-<index>.<job>). Index 0 runs the benchmark suite, the agent fleet and the
# coordination store, and trains as rank 0. Indices >= 1 run pipeline.distributed workers
# under a restart loop, so a worker process that dies is replaced inside its pod and can
# rejoin the next training attempt. Every pod samples its own cgroup counters and uploads
# them to S3 next to the results bundle.
apiVersion: v1
kind: Service
metadata:
  name: ${JOB_NAME}
  namespace: autopark
  labels:
    app: autopark-dist
    run-tag: ${RUN_TAG}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    job-name: ${JOB_NAME}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: autopark
  labels:
    app: autopark-dist
    run-tag: ${RUN_TAG}
spec:
  completions: ${WORLD_SIZE}
  parallelism: ${WORLD_SIZE}
  completionMode: Indexed
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: autopark-dist
        run-tag: ${RUN_TAG}
    spec:
      subdomain: ${JOB_NAME}
      serviceAccountName: autopark-eval
      restartPolicy: Never
      nodeSelector:
        role: autopark-dist
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  run-tag: ${RUN_TAG}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: rank
          image: public.ecr.aws/docker/library/python:3.11.15-slim
          workingDir: /app
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              export BOOTSTRAP_STARTED_AT=$(date +%s.%N)
              export AUTOPARK_RANK="$JOB_COMPLETION_INDEX"
              pip install --no-cache-dir -q boto3==1.43.78
              python -c "import boto3,tarfile,io; b=boto3.client('s3').get_object(Bucket='${BUCKET}',Key='${CODE_KEY}')['Body'].read(); tarfile.open(fileobj=io.BytesIO(b)).extractall('/app')"
              pip install --no-cache-dir -q torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
              pip install --no-cache-dir -q -r eks/requirements-eval.txt
              if [ "$AUTOPARK_RANK" = "0" ]; then
                python benchmarks/eks_entrypoint.py --bucket ${BUCKET} --prefix ${RESULTS_PREFIX} -- ${BENCH_ARGS}
              else
                python benchmarks/eks_entrypoint.py --bucket ${BUCKET} --prefix ${RESULTS_PREFIX} --worker
              fi
          env:
            - name: AWS_REGION
              value: us-east-1
            - name: CODE_SHA
              value: "${CODE_SHA}"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: AUTOPARK_WORLD_SIZE
              value: "${WORLD_SIZE}"
            - name: AUTOPARK_MASTER_ADDR
              value: "${JOB_NAME}-0.${JOB_NAME}"
            - name: AUTOPARK_STORE_PORT
              value: "29400"
            - name: GLOO_SOCKET_IFNAME
              value: eth0
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: ANTHROPIC_AWS_API_KEY
              valueFrom: {secretKeyRef: {name: claude-platform-aws, key: api-key}}
            - name: ANTHROPIC_AWS_WORKSPACE_ID
              valueFrom: {secretKeyRef: {name: claude-platform-aws, key: workspace-id}}
          resources:
            requests:
              cpu: "3000m"
              memory: "5Gi"
            limits:
              memory: "6Gi"
